<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HR Assistant</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #dcdfe4;
    --text: #1f2328;
    --muted: #6b7280;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --assistant-bubble: #eef0f3;
    --assistant-text: #1f2328;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
    white-space: nowrap;
  }
  header .spacer { flex: 1; }
  header label {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  header input[type="text"] {
    font-size: 0.85rem;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 8rem;
  }
  header button {
    font-size: 0.8rem;
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    cursor: pointer;
  }
  header button:hover { background: var(--bg); }

  #conversation {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .bubble {
    max-width: min(32rem, 80%);
    padding: 0.55rem 0.8rem;
    border-radius: 10px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 2px;
  }
  .bubble.user[dir="rtl"] { border-bottom-right-radius: 10px; border-bottom-left-radius: 2px; }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--assistant-text);
    border-bottom-left-radius: 2px;
  }
  .bubble.assistant[dir="rtl"] { border-bottom-left-radius: 10px; border-bottom-right-radius: 2px; }
  .bubble.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    font-style: italic;
  }

  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    gap: 0.5rem;
  }
  #messageInput {
    flex: 1;
    font-size: 0.95rem;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  #sendButton {
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #sendButton:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>HR Assistant</h1>
  <label>Employee ID
    <!-- "9" is a real, verified id in the live BambooHR trial account this
         demo currently points HRIS_DRIVER=bamboohr at (Jennifer Caldwell) --
         not a made-up placeholder. If the account's data changes again, or
         HRIS_DRIVER switches to "memory", update this to an id that
         actually exists for whichever driver is active. -->
    <input type="text" id="employeeId" placeholder="a real employee id for the active driver" value="9" />
  </label>
  <div class="spacer"></div>
  <button id="resetButton" type="button">New conversation</button>
</header>

<div id="conversation">
  <div class="bubble system">Ask about leave balances, requesting leave, daily check-ins, team summaries, gratuity, or general HR policy. Type in English or Arabic.</div>
</div>

<footer>
  <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
  <button id="sendButton" type="button">Send</button>
</footer>

<script>
  let sessionId = null;
  // Mirrors app/core/i18n.py's _ARABIC_SCRIPT_RE exactly (the core
  // Arabic Unicode block, U+0600-U+06FF) so client-side bubble
  // direction and the server's own language detection never disagree
  // about what counts as Arabic.
  const ARABIC_SCRIPT_RE = /[؀-ۿ]/;

  const conversation = document.getElementById("conversation");
  const messageInput = document.getElementById("messageInput");
  const employeeIdInput = document.getElementById("employeeId");
  const sendButton = document.getElementById("sendButton");
  const resetButton = document.getElementById("resetButton");

  function appendBubble(role, text) {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    if (role !== "system") {
      bubble.dir = ARABIC_SCRIPT_RE.test(text) ? "rtl" : "ltr";
    }
    bubble.textContent = text;
    conversation.appendChild(bubble);
    conversation.scrollTop = conversation.scrollHeight;
  }

  async function sendMessage() {
    const text = messageInput.value.trim();
    const employeeId = employeeIdInput.value.trim();
    if (!text) return;
    if (!employeeId) {
      appendBubble("system", "Enter an employee ID first.");
      return;
    }

    appendBubble("user", text);
    messageInput.value = "";
    messageInput.disabled = true;
    sendButton.disabled = true;

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          employee_id: employeeId,
          message: text,
          session_id: sessionId,
        }),
      });

      if (!response.ok) {
        appendBubble("system", "Request failed (HTTP " + response.status + ").");
        return;
      }

      const data = await response.json();
      sessionId = data.session_id;
      appendBubble("assistant", data.reply);
    } catch (err) {
      appendBubble("system", "Network error -- is the server running?");
    } finally {
      messageInput.disabled = false;
      sendButton.disabled = false;
      messageInput.focus();
    }
  }

  function resetConversation() {
    sessionId = null;
    conversation.innerHTML = "";
    appendBubble("system", "New conversation started.");
    messageInput.focus();
  }

  sendButton.addEventListener("click", sendMessage);
  resetButton.addEventListener("click", resetConversation);
  messageInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      sendMessage();
    }
  });

  messageInput.focus();
</script>

</body>
</html>
