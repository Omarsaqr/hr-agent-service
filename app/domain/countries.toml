[Egypt]
name = "Egypt"

[Egypt.annual_leave]
citation = "Egyptian Labour Law No. 14 of 2025 (annual leave provisions; specific article not confirmed in secondary sources)"
source_url = "https://www.ey.com/en_gl/technical/tax-alerts/egypt-enacts-new-labor-law-with-changes-affecting-employers-beginning-1-september-2025"
last_reviewed = 2026-09-05
note = "Law No. 14 of 2025 (in force since 2025-09-01) superseded Law No. 12 of 2003 and changed this rule. Encoded here: 15 days in year one, 21 from year two, 30 after 10 years or age 50 -- consistent across EY, Lexology, and Amereller client alerts. An alternative reading in circulation (21 days after 6 months) appears to describe the superseded 2003 law. The new law also grants 45 days to employees with disabilities; not modelled here, since no disability-status field exists on the employee record."

