# Weekends and public holidays are separate from countries.toml on purpose:
# that file is leave-entitlement law, this is calendar fact. Public holidays
# here are intentionally a partial list -- only fixed Gregorian dates that a
# reliable source states outright. Moveable Islamic-calendar holidays (Eid
# al-Fitr, Eid al-Adha, Islamic New Year, the Prophet's Birthday) depend on
# moon sighting and aren't fixed far enough in advance to encode responsibly
# here; see docs/ROADMAP.md.

[KSA]
# weekend_weekdays uses date.weekday(): Monday=0 .. Sunday=6.
weekend_weekdays = [4, 5]  # Friday, Saturday

[[KSA.holidays]]
date = 2026-02-22
name = "Founding Day"

[[KSA.holidays]]
date = 2026-09-23
name = "National Day"


[UAE]
# Sat-Sun since the January 2022 federal reform. Adopted by most large
# private employers, but private-sector Fri-Sat schedules still exist --
# this table takes the now-dominant convention, not a universal mandate.
weekend_weekdays = [5, 6]  # Saturday, Sunday

[[UAE.holidays]]
date = 2026-01-01
name = "New Year's Day"


[Egypt]
weekend_weekdays = [4, 5]  # Friday, Saturday

[[Egypt.holidays]]
date = 2026-05-01
name = "Labour Day"


[Jordan]
weekend_weekdays = [4, 5]  # Friday, Saturday

[[Jordan.holidays]]
date = 2026-01-01
name = "New Year's Day"

[[Jordan.holidays]]
date = 2026-05-01
name = "Labour Day"

[[Jordan.holidays]]
date = 2026-12-25
name = "Christmas Day"
